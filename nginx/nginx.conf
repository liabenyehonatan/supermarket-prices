# Edge proxy: static frontend, API with a short shared cache and rate limits.

upstream api {
    server api:8000;
    keepalive 16;
}

upstream frontend {
    server frontend:80;
}

# With HTTPS on (docker compose profile "https") every request reaches this nginx from Caddy, whose address
# would otherwise be the one "client" the rate limits below count. Trust the forwarded address only when the
# request comes from a private (docker network) address; a direct visitor's own header is ignored.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The protocol the visitor used: Caddy's answer when it sits in front, otherwise this server's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

# 20 requests/s per client address for the API, bursts of 40 allowed.
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
# Product-picture lookups can reach Shufersal's site, so they get their own, stricter allowance.
limit_req_zone $binary_remote_addr zone=img_rate:10m rate=10r/s;
limit_req_status 429;

# Prices change a few times a day, so identical GET requests can be answered
# from this cache for a few minutes without touching the database.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:20m
                 max_size=200m inactive=30m use_temp_path=off;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types application/json text/css application/javascript text/plain image/svg+xml;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;       # largest legitimate body is a basket of barcodes

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://*.cloudinary.com https://*.shufersal.co.il https://*.openfoodfacts.org; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # API
    # Product pictures: a redirect (or a "no picture" 404) is stable, so keep it for a while.
    location ~ ^/api/v1/products/[^/]+/image$ {
        proxy_pass http://api;
        limit_req zone=api_rate burst=40 nodelay;
        limit_req zone=img_rate burst=30 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
        proxy_cache api_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 302 404 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /api/ {
        limit_req zone=api_rate burst=40 nodelay;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;

        # Only GET responses are cached (POST bodies differ per request).
        proxy_cache api_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;                      # one request fills a missing entry
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Crawler files are generated by the API from the address they are requested on.
    location = /robots.txt  { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
    location ~ ^/sitemap(-pages|-products-[0-9]+)?\.xml$ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $forwarded_proto; }

    # The interactive API docs are not for the public (they work on the API container locally).
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # Liveness for load balancers; data freshness for uptime monitors.
    location = /health      { proxy_pass http://api; access_log off; }
    location = /health/data { proxy_pass http://api; access_log off; }

    # Built files of the app (scripts, styles, pictures, icons, manifest): straight from the frontend.
    location ~ ^/(assets/|.+\.[A-Za-z0-9]+$) {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Every page address goes through the API, which puts the page's own title, description, canonical link and
    # structured data into the app's HTML (search engines and link previews read those without running the app)
    # and answers 404 for an address that is not a page. If the API cannot, the plain app is served instead.
    location = /index.html { return 301 /; }

    location / {
        limit_req zone=api_rate burst=40 nodelay;
        proxy_pass http://api/_seo/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_cache api_cache;
        proxy_cache_key "$forwarded_proto$host$request_uri";
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location @spa {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
