# Edge proxy: static frontend, API with a short shared cache and rate limits.

upstream api {
    server api:8000;
    keepalive 16;
}

upstream frontend {
    server frontend:80;
}

# 20 requests/s per client address for the API, bursts of 40 allowed.
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
limit_req_status 429;

# Prices change a few times a day, so identical GET requests can be answered
# from this cache for a few minutes without touching the database.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:20m
                 max_size=200m inactive=30m use_temp_path=off;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types application/json text/css application/javascript text/plain image/svg+xml;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;       # largest legitimate body is a basket of barcodes

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API
    location /api/ {
        limit_req zone=api_rate burst=40 nodelay;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;

        # Only GET responses are cached (POST bodies differ per request).
        proxy_cache api_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;                      # one request fills a missing entry
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # API docs
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # Liveness for load balancers; data freshness for uptime monitors.
    location = /health      { proxy_pass http://api; access_log off; }
    location = /health/data { proxy_pass http://api; access_log off; }

    # Everything else is the single-page app.
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
