server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change: cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # A request for a file that does not exist is a 404, not the app (crawlers took the HTML for a
    # robots/sitemap/icon file).
    location ~* \.(?:png|jpe?g|webp|svg|ico|txt|xml|webmanifest|json|map|woff2?|js|css)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Single-page app: any other path is handled by the router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
