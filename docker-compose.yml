# Single-host deployment (an Israeli VPS: several chains only answer Israeli IPs).
#
#   cp .env.example .env   # fill in the passwords
#   docker compose up -d --build
#
# Data flow: worker (scrape -> parse -> delete) -> db <- api (read-only) <- nginx
# Only nginx publishes a port. The database is not reachable from outside.

x-backend: &backend
  build: .
  image: supermarket-backend   # one image shared by migrate, api and worker
  restart: unless-stopped
  init: true            # reap the scraper libraries' child processes

x-owner-db: &owner-db
  DATABASE_URL: postgresql+asyncpg://supermarket:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/supermarket_prices

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: supermarket_prices
      POSTGRES_USER: supermarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in .env}
    # Sized for a 4 GB host; scale shared_buffers (~25% of RAM) with the box.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=60
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermarket -d supermarket_prices"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations as the owner role, then exits.
  migrate:
    <<: *backend
    restart: "no"
    command: python -m alembic upgrade head
    environment:
      <<: *owner-db
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000
      --workers ${API_WORKERS:-2} --proxy-headers --forwarded-allow-ips='*'
    environment:
      # Read-only role: a bug or injection in the public API cannot alter prices.
      DATABASE_URL: postgresql+asyncpg://api_ro:${API_DB_PASSWORD}@db:5432/supermarket_prices
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      FRONTEND_URL: ${FRONTEND_URL:-}
      MAX_DATA_AGE_HOURS: ${MAX_DATA_AGE_HOURS:-36}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    <<: *backend
    command: python -m app.worker
    stop_grace_period: 3m        # lets the current file finish loading on `docker stop`
    shm_size: 1gb                # headless Chromium for the scrapers that need it
    environment:
      <<: *owner-db
      DELETE_AFTER_INGEST: "true"          # the ledger, not the disk, remembers what is loaded
      SKIP_BLOCKED_CHAINS: ${SKIP_BLOCKED_CHAINS:-false}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-}
      SCRAPE_CONCURRENCY: ${SCRAPE_CONCURRENCY:-3}
      PARSE_CONCURRENCY: ${PARSE_CONCURRENCY:-2}
      RUN_AT: ${RUN_AT:-06:00}
      RETRY_MAX: ${RETRY_MAX:-2}
      RETRY_AFTER_HOURS: ${RETRY_AFTER_HOURS:-2}
      MIN_FREE_DISK_GB: ${MIN_FREE_DISK_GB:-5}
      SCRAPE_PROMOS: ${SCRAPE_PROMOS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # dumps/status (the scraper's "already downloaded" memory) lives here too:
      # losing this volume means every file is downloaded once more.
      - dumps:/app/dumps
    security_opt:
      - no-new-privileges:true

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: supermarket
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: supermarket_prices
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-0}
      HEALTHCHECK_BACKUP_URL: ${HEALTHCHECK_BACKUP_URL:-}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx/api
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
  dumps:
  backups:
  nginx_cache:
